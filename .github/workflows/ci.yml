name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: lazier

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: lazier
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hudrucan/codex-with-chatgpt
          ref: 47d13c9b3fe55b1a11e43a8ceabfa0406a11317a
          path: c2c-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test
        run: python3 tools/test_package.py --c2c-source ../c2c-source
      - name: Build and check release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 tools/package.py --c2c-source ../c2c-source --build --tag "$GITHUB_REF_NAME"
          else
            python3 tools/package.py --c2c-source ../c2c-source --build
          fi
      - name: Verify reproducibility and archive
        run: |
          cp dist/*.zip "$RUNNER_TEMP/skill.zip"
          python3 tools/package.py --c2c-source ../c2c-source --build
          cmp "$RUNNER_TEMP/skill.zip" dist/*.zip
          python3 tools/package.py --c2c-source ../c2c-source
      - name: Verify checksum
        working-directory: lazier/dist
        run: sha256sum --check *.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: skill
          path: |
            lazier/dist/*.zip
            lazier/dist/*.sha256
            lazier/dist/*.provenance.json
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: lazier
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hudrucan/codex-with-chatgpt
          ref: 47d13c9b3fe55b1a11e43a8ceabfa0406a11317a
          path: c2c-source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skill
          path: lazier/dist
      - name: Validate downloaded release assets
        run: python3 tools/package.py --c2c-source ../c2c-source --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/*.provenance.json \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
